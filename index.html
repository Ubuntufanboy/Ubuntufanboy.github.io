<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo - AI Safety Research</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --terminal-green: #00ff41;
            --matrix-green: #00d930;
            --dark-green: #003d1a;
            --deep-black: #0a0a0a;
            --pure-black: #000000;
            --gray-800: #1a1a1a;
            --gray-700: #2a2a2a;
            --gray-600: #3a3a3a;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: var(--pure-black);
            color: var(--terminal-green);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(0, 255, 65, 0.03) 50%,
                transparent 100%
            );
            pointer-events: none;
            z-index: 1000;
            animation: scan 8s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            border: 3px solid var(--terminal-green);
            padding: 60px 40px;
            margin-bottom: 60px;
            background: var(--deep-black);
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
        }

        header::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(45deg, var(--terminal-green), var(--dark-green), var(--terminal-green));
            z-index: -1;
            animation: border-flow 3s linear infinite;
        }

        @keyframes border-flow {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .hero-title {
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: bold;
            color: var(--terminal-green);
            letter-spacing: 0.2em;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.8);
        }

        .hero-title::before {
            content: '> ';
            color: var(--matrix-green);
        }

        .tagline {
            font-size: 1.5rem;
            color: var(--matrix-green);
            margin-bottom: 15px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--terminal-green);
            opacity: 0.7;
            letter-spacing: 0.1em;
            border-left: 3px solid var(--terminal-green);
            padding-left: 20px;
            margin-top: 30px;
        }

        nav {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
        }

        .nav-btn {
            padding: 20px;
            background: var(--gray-800);
            border: 2px solid var(--terminal-green);
            color: var(--terminal-green);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--terminal-green);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .nav-btn:hover::before {
            left: 0;
        }

        .nav-btn:hover {
            color: var(--pure-black);
        }

        .nav-btn.active {
            background: var(--terminal-green);
            color: var(--pure-black);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.5);
        }

        #content {
            background: var(--gray-800);
            border: 2px solid var(--terminal-green);
            padding: 60px;
            margin-bottom: 60px;
            min-height: 500px;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.2);
        }

        .landing {
            max-width: 1000px;
        }

        .landing h2 {
            font-size: 2.5rem;
            color: var(--terminal-green);
            margin-bottom: 40px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            border-bottom: 3px solid var(--terminal-green);
            padding-bottom: 20px;
        }

        .landing p {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 40px;
            color: var(--matrix-green);
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin: 60px 0;
        }

        .feature-card {
            background: var(--gray-700);
            padding: 40px;
            border: 2px solid var(--dark-green);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--terminal-green);
            transition: width 0.3s ease;
        }

        .feature-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 0;
            height: 2px;
            background: var(--terminal-green);
            transition: width 0.3s ease;
        }

        .feature-card:hover {
            border-color: var(--terminal-green);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
        }

        .feature-card:hover::before,
        .feature-card:hover::after {
            width: 100%;
        }

        .feature-card h3 {
            color: var(--terminal-green);
            margin-bottom: 20px;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        .feature-card p {
            color: var(--matrix-green);
            line-height: 1.7;
        }

        .status-box {
            margin-top: 80px;
            padding: 40px;
            background: var(--deep-black);
            border: 2px solid var(--terminal-green);
            border-left: 6px solid var(--terminal-green);
        }

        .status-box h3 {
            color: var(--terminal-green);
            margin-bottom: 20px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .status-box p {
            color: var(--matrix-green);
            line-height: 1.8;
        }

        .blog-list {
            display: grid;
            gap: 30px;
        }

        .blog-item {
            background: var(--gray-700);
            padding: 40px;
            border: 2px solid var(--dark-green);
            border-left: 6px solid var(--terminal-green);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .blog-item:hover {
            background: var(--gray-600);
            border-color: var(--terminal-green);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
            transform: translateX(10px);
        }

        .blog-item h3 {
            color: var(--terminal-green);
            margin-bottom: 15px;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .blog-item .date {
            color: var(--matrix-green);
            font-size: 0.9rem;
            margin-bottom: 15px;
            letter-spacing: 0.1em;
        }

        .blog-item .date::before {
            content: '[ ';
        }

        .blog-item .date::after {
            content: ' ]';
        }

        .blog-item .preview {
            color: var(--matrix-green);
            line-height: 1.7;
        }

        .blog-content h1 {
            font-size: 2.8rem;
            color: var(--terminal-green);
            margin: 40px 0 30px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-bottom: 3px solid var(--terminal-green);
            padding-bottom: 20px;
        }

        .blog-content h2 {
            font-size: 2rem;
            color: var(--terminal-green);
            margin: 35px 0 20px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .blog-content h3 {
            font-size: 1.5rem;
            color: var(--matrix-green);
            margin: 30px 0 15px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .blog-content p {
            line-height: 1.9;
            margin-bottom: 25px;
            color: var(--matrix-green);
            font-size: 1.05rem;
        }

        .blog-content code {
            background: var(--deep-black);
            padding: 3px 10px;
            border: 1px solid var(--dark-green);
            color: var(--terminal-green);
        }

        .blog-content pre {
            background: var(--deep-black);
            padding: 30px;
            border: 2px solid var(--terminal-green);
            overflow-x: auto;
            margin: 30px 0;
        }

        .blog-content pre code {
            background: none;
            padding: 0;
            border: none;
        }

        .blog-content a {
            color: var(--terminal-green);
            text-decoration: none;
            border-bottom: 1px solid var(--terminal-green);
            transition: all 0.3s;
        }

        .blog-content a:hover {
            color: var(--pure-black);
            background: var(--terminal-green);
            padding: 2px 5px;
            border-bottom: none;
        }

        .blog-content blockquote {
            border-left: 4px solid var(--terminal-green);
            padding-left: 30px;
            margin: 30px 0;
            font-style: italic;
            color: var(--matrix-green);
            background: var(--gray-700);
            padding: 20px 20px 20px 30px;
        }

        .blog-content ul, .blog-content ol {
            margin: 25px 0 25px 40px;
            line-height: 1.9;
        }

        .blog-content li {
            margin-bottom: 15px;
            color: var(--matrix-green);
        }

        .blog-content li::marker {
            color: var(--terminal-green);
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 40px;
            padding: 15px 40px;
            background: var(--gray-700);
            border: 2px solid var(--terminal-green);
            color: var(--terminal-green);
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--terminal-green);
            color: var(--pure-black);
        }

        .loading {
            text-align: center;
            padding: 80px;
            color: var(--terminal-green);
            font-size: 1.5rem;
            letter-spacing: 0.2em;
        }

        .error {
            text-align: center;
            padding: 80px;
            color: var(--terminal-green);
        }

        .error h2 {
            margin-bottom: 30px;
            font-size: 2rem;
            letter-spacing: 0.15em;
        }

        .error pre {
            text-align: left;
            max-width: 600px;
            margin: 30px auto;
            background: var(--deep-black);
            padding: 30px;
            border: 2px solid var(--terminal-green);
        }

        footer {
            text-align: center;
            padding: 60px 20px;
            color: var(--matrix-green);
            border-top: 2px solid var(--dark-green);
            margin-top: 60px;
            letter-spacing: 0.1em;
        }

        footer p {
            margin: 10px 0;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            #content {
                padding: 30px 20px;
            }
            
            .hero-title {
                font-size: 2.5rem;
                letter-spacing: 0.1em;
            }
            
            header {
                padding: 40px 20px;
            }
            
            .feature-grid {
                grid-template-columns: 1fr;
            }
            
            nav {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    
    <div class="container">
        <header>
            <h1 class="hero-title">APOLLO</h1>
            <p class="tagline">AI Safety Research</p>
            <p class="subtitle">Artificial intelligence is art, and I am a painter</p>
        </header>

        <nav id="nav"></nav>

        <div id="content"></div>

        <footer>
            <p>APOLLO / AI SAFETY RESEARCHER</p>
            <p>Built with intention / Deployed with purpose</p>
        </footer>
    </div>

    <script>
        const blogConfig = {
            postsDir: 'posts',
            dirs: []
        };

        let currentView = 'home';
        let blogPosts = [];

        async function init() {
            await loadBlogStructure();
            renderNav();
            showHome();
        }

        async function loadBlogStructure() {
            try {
                const response = await fetch('file:///home/anon/blog/posts.json');
                if (response.ok) {
                    const data = await response.json();
                    blogPosts = data.posts || [];
                } else {
                    blogPosts = [];
                }
            } catch (e) {
                console.error('Error loading blog structure:', e);
                blogPosts = [];
            }
        }

        function renderNav() {
            const nav = document.getElementById('nav');
            nav.innerHTML = `
                <button class="nav-btn ${currentView === 'home' ? 'active' : ''}" onclick="showHome()">Home</button>
                <button class="nav-btn ${currentView === 'blog' ? 'active' : ''}" onclick="showBlog()">Research</button>
                <button class="nav-btn" onclick="window.open('https://github.com/yourusername', '_blank')">GitHub</button>
            `;
        }

        function showHome() {
            currentView = 'home';
            renderNav();
            
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="landing">
                    <h2>Philosophy</h2>
                    <p>
                        The creation of artificial intelligence is not merely an engineering challenge.
                        It is an act of artistic expression, a canvas where mathematics meets meaning,
                        where architecture becomes philosophy. Every model trained, every alignment
                        technique refined, is a brushstroke in humanity's greatest work.
                    </p>
                    <p>
                        I approach AI safety not as a constraint, but as the foundation that allows
                        true creativity to flourish. Safety is the frame that holds the painting,
                        the structure that permits innovation without chaos. Here, I document the
                        process of painting with intelligence itself.
                    </p>
                    
                    <div class="feature-grid">
                        <div class="feature-card" onclick="showBlog()">
                            <h3>Technical Research</h3>
                            <p>Deep explorations into alignment theory, mechanistic interpretability, 
                            and the architectures that shape machine cognition. Where theory meets implementation.</p>
                        </div>
                        
                        <div class="feature-card" onclick="showBlog()">
                            <h3>Mental Models</h3>
                            <p>Frameworks for understanding systems that learn, adapt, and evolve. 
                            Conceptual tools for navigating the complexity of intelligent systems.</p>
                        </div>
                        
                        <div class="feature-card" onclick="showBlog()">
                            <h3>Methodology</h3>
                            <p>The intersection of rigor and intuition. How we ask questions, 
                            structure experiments, and extract insight from uncertainty.</p>
                        </div>
                        
                        <div class="feature-card" onclick="showBlog()">
                            <h3>Reflections</h3>
                            <p>Broader considerations on the trajectory of artificial intelligence, 
                            its implications, and the philosophy that guides responsible development.</p>
                        </div>
                    </div>
                    
                    <div class="status-box">
                        <h3>Current Focus</h3>
                        <p>
                            Investigating novel approaches to scalable oversight and the measurement
                            of emergent capabilities in large language models. The goal is not simply
                            to make AI safe, but to understand the fundamental nature of the systems
                            we are building.
                        </p>
                    </div>
                </div>
            `;
        }

        function showBlog() {
            currentView = 'blog';
            renderNav();
            
            const content = document.getElementById('content');
            
            if (blogPosts.length === 0) {
                content.innerHTML = `
                    <div class="error">
                        <h2>No Posts Available</h2>
                        <p style="margin-top: 20px;">Create a posts.json file in your root directory:</p>
                        <pre><code>{
  "posts": [
    {
      "path": "posts/alignment-theory.md",
      "title": "Foundations of Alignment Theory",
      "date": "2025-01-04",
      "preview": "An exploration of core principles..."
    }
  ]
}</code></pre>
                        <p style="margin-top: 30px;">Add markdown files to your posts directory and reference them in posts.json</p>
                    </div>
                `;
                return;
            }

            const postsList = blogPosts.map(post => `
                <div class="blog-item" onclick="loadPost('${post.path}')">
                    <h3>${post.title || 'Untitled'}</h3>
                    <div class="date">${post.date || 'Date unknown'}</div>
                    <div class="preview">${post.preview || 'Click to read more'}</div>
                </div>
            `).join('');

            content.innerHTML = `
                <h2 style="font-size: 2.5rem; color: var(--terminal-green); margin-bottom: 50px; letter-spacing: 0.15em; text-transform: uppercase; border-bottom: 3px solid var(--terminal-green); padding-bottom: 20px;">
                    Research Archive
                </h2>
                <div class="blog-list">
                    ${postsList}
                </div>
            `;
        }

        async function loadPost(path) {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">LOADING...</div>';

            try {
                const response = await fetch(path);
                if (!response.ok) throw new Error('Post not found');
                
                const markdown = await response.text();
                const html = marked.parse(markdown);
                
                content.innerHTML = `
                    <a href="#" class="back-btn" onclick="showBlog(); return false;">Return</a>
                    <div class="blog-content">
                        ${html}
                    </div>
                `;
            } catch (e) {
                content.innerHTML = `
                    <div class="error">
                        <h2>Post Not Found</h2>
                        <p style="margin-top: 30px;">The requested content could not be located.</p>
                        <a href="#" class="back-btn" style="display: inline-block; margin-top: 30px;" onclick="showBlog(); return false;">Return</a>
                    </div>
                `;
            }
        }

        init();
    </script>
</body>
</html>
