<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000000;
            font-family: 'Arial', sans-serif;
            color: #FFFFFF;
            height: 100vh;
            overflow: hidden;
        }
        
        .right-panel {
            position: fixed;
            right: 0;
            top: 0;
            width: 400px;
            height: 100vh;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        .clock {
            font-size: 72px;
            font-weight: bold;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
        }
        
        .date {
            font-size: 24px;
            margin-top: -10px;
        }
        
        .day {
            font-size: 20px;
            margin-top: -5px;
            font-weight: 300;
        }
        
        .weather {
            font-size: 20px;
            line-height: 1.6;
        }
        
        .corgi-image {
            width: 100%;
            height: auto;
            border: 2px solid #FFFFFF;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="right-panel">
        <div class="clock" id="clock">00:00:00</div>
        <div class="date" id="date"></div>
        <div class="day" id="day"></div>
        <div class="weather" id="weather">Loading weather...</div>
        <img src="https://external-content.duckduckgo.com/iu/?u=http%3A%2F%2Fdgicdplf3pvka.cloudfront.net%2Fimages%2Fdogbreeds%2Flarge%2FCorgi.jpg&f=1&nofb=1&ipt=269b9d666d93651b0ad1af0b12eb40ece0a1f0022d7e5aa94cb7d50089919efc" alt="Corgi" class="corgi-image">
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        }

        function updateDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
            
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            document.getElementById('day').textContent = days[now.getDay()];
        }

        async function getWeather() {
            try {
                const response = await fetch('https://wttr.in/New_York,NJ?format=j1');
                const data = await response.json();
                const current = data.current_condition[0];
                const temp = current.temp_F;
                const desc = current.weatherDesc[0].value;
                document.getElementById('weather').innerHTML = `${temp}°F<br>${desc}`;
            } catch (error) {
                document.getElementById('weather').textContent = 'Weather unavailable';
            }
        }

        updateClock();
        updateDate();
        getWeather();
        
        setInterval(updateClock, 1000);
        setInterval(getWeather, 600000); // Update weather every 10 minutes
    </script>
</body>
</html>
